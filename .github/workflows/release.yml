name: Release Elmadani Labs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare production signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ELMADANI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ELMADANI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ELMADANI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ELMADANI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing ELMADANI_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing ELMADANI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing ELMADANI_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing ELMADANI_KEY_PASSWORD"; exit 1; }
          keystore_path="$RUNNER_TEMP/elmadani-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ELMADANI_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Determine unique Android version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version_name"
          test -n "$version_code"

          base_name="$version_name"
          while gh release view "v$version_name" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            if [[ "$version_name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              version_name="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
            else
              echo "Existing release v$version_name found, but versionName is not major.minor.patch: $base_name"
              exit 1
            fi
            version_code=$((version_code + 1))
          done

          python3 - "$version_name" "$version_code" <<'PY'
          import pathlib
          import re
          import sys

          path = pathlib.Path("app/build.gradle.kts")
          text = path.read_text()
          text, names = re.subn(r'(versionCode\s*=\s*)\d+', rf'\g<1>{sys.argv[2]}', text, count=1)
          text, versions = re.subn(r'(versionName\s*=\s*")[^"]+(")', rf'\g<1>{sys.argv[1]}\g<2>', text, count=1)
          if names != 1 or versions != 1:
              raise SystemExit("Could not update versionCode/versionName in app/build.gradle.kts")
          path.write_text(text)
          PY

          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"
          echo "asset=elmadani-labs-$version_name.apk" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ELMADANI_KEYSTORE_PASSWORD: ${{ secrets.ELMADANI_KEYSTORE_PASSWORD }}
          ELMADANI_KEY_ALIAS: ${{ secrets.ELMADANI_KEY_ALIAS }}
          ELMADANI_KEY_PASSWORD: ${{ secrets.ELMADANI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Extract app metadata
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          badging=$($build_tools/aapt dump badging app/build/outputs/apk/release/app-release.apk)
          package_name=$(printf '%s\n' "$badging" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")
          version_name=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionName='\\([^']*\\)'.*/\\1/p")
          version_code=$(printf '%s\n' "$badging" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")
          test -n "$package_name" && test -n "$version_name" && test -n "$version_code"
          printf '{"packageName":"%s","versionName":"%s","versionCode":%s}\n' "$package_name" "$version_name" "$version_code" > app/build/outputs/apk/release/elmadani-app.json
          python3 -c 'import pathlib,sys,zipfile; apk_path,icon_path=sys.argv[1:]; apk=zipfile.ZipFile(apk_path); candidates=[(info.file_size,info.filename) for info in apk.infolist() if info.filename.lower().endswith(".png") and info.filename.startswith(("res/mipmap","res/drawable"))]; selected=max(candidates)[1] if candidates else (_ for _ in ()).throw(SystemExit("No PNG application icon found in APK")); pathlib.Path(icon_path).write_bytes(apk.read(selected)); apk.close()' \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/elmadani-app-icon.png

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/release/app-release.apk"
          release_notes=$(printf '## Elmadani Labs %s\n\n- Version: `%s`\n- Version code: `%s`\n- Commit: `%s`\n- Build date: `%s`\n- APK: `%s`\n\n### Changes\n' "$RELEASE_TAG" "$VERSION_NAME" "$VERSION_CODE" "$COMMIT_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$ASSET_NAME")
          gh release create "$RELEASE_TAG" "$apk_path#$ASSET_NAME" \
            "app/build/outputs/apk/release/elmadani-app.json#elmadani-app.json" \
            "app/build/outputs/apk/release/elmadani-app-icon.png#elmadani-app-icon.png" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Elmadani Labs $RELEASE_TAG" \
            --generate-notes \
            --notes "$release_notes" \
            --target "$COMMIT_SHA"
